name: Reposit
description: >-
  Reposit is a UK-based PropTech and fintech company offering a deposit
  alternative for the residential rental market. Instead of paying a traditional
  cash deposit, tenants pay a one-time, non-refundable fee (typically one week's
  rent) for insurance-backed cover, while landlords and letting agents receive
  protection worth up to eight weeks' rent. The FCA-authorised product is
  underwritten by a leading insurer and serves letting agents, build-to-rent
  (BTR) operators, landlords and tenants, with integrations into common property
  management tools. This profile was surfaced as a Seedcamp portfolio company and
  enriched by the API Evangelist pipeline; Reposit publishes no public developer
  API surface at the time of enrichment.
